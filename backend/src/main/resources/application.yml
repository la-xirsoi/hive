spring:
  application:
    name: hive
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Comment timestamps are stored as UTC wall-clock in DATETIME2(0) and are
        # mapped through LocalDateTime, so this setting does not decide their
        # correctness -- it is here so that any future Instant/Timestamp column
        # binds in UTC rather than in whatever zone the JVM happens to run in.
        jdbc:
          time_zone: UTC
        # Batch the inserts/updates that TM-8's saveAll produces.
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50

server:
  port: 8080

# Only the health probe is published (docs/api-contract.md section 7): it is the
# one actuator endpoint the container healthcheck needs, and every other one
# would be an unauthenticated window into the running process.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# =============================================================================
# dev -- a real SQL Server 2022, typically the one from the compose stack.
#
# Connection details come from the environment. HIVE_DB_URL has a localhost
# default purely so that a developer with the compose stack running needs no
# setup; the credentials deliberately have NO defaults, so a missing
# HIVE_DB_PASSWORD fails fast at startup instead of silently trying a
# well-known password. Nothing secret is committed to this file.
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${HIVE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=hive;encrypt=true;trustServerCertificate=true}
    username: ${HIVE_DB_USERNAME}
    password: ${HIVE_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: hive-dev
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entity mappings
      # agree with it. Never `update` -- a schema that drifts to match the code
      # is a schema nobody can reproduce.
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # The dev profile has no identity provider to point at, so this URI is not
  # fetched: it is the `iss` claim the local issuer stamps on the tokens it
  # mints and the value the local decoder then requires (see DevAuthConfig).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${HIVE_JWT_ISSUER_URI:https://dev.hive.local}

hive:
  dev-auth:
    token-ttl-seconds: ${HIVE_DEV_TOKEN_TTL:3600}

---
# =============================================================================
# test -- embedded H2 in SQL Server compatibility mode.
#
# There is no container runtime on the build machine, so there is no real SQL
# Server to test against. H2's MODE=MSSQLServer is close enough to run the
# Flyway migrations *themselves* -- IDENTITY(1,1), NVARCHAR, DATETIME2(0), named
# CHECK/UNIQUE/FOREIGN KEY constraints all parse and behave -- so the tests
# exercise the real DDL rather than a Hibernate-generated replica of it, and
# `ddl-auto: validate` then proves the entity mappings match that DDL.
#
# What this does and does not prove is documented in docs/testing.md. Read it
# before trusting a green build as evidence about production.
# =============================================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:hive;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  # A syntactically valid issuer that is never contacted. Spring Boot builds a
  # *deferred* decoder from `issuer-uri`, so nothing is fetched at startup, and
  # the web-layer tests either supply their own decoder or send no token at all.
  # HTTPS is deliberately NOT enforced under this profile: MockMvc speaks plain
  # HTTP, so AU-3's channel rule lives in the prod-only HttpsEnforcementConfig.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.test.invalid

---
# =============================================================================
# prod -- a real SQL Server 2022. Every connection setting is required from the
# environment; there are no defaults and no credentials in this file.
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${HIVE_DB_URL}
    username: ${HIVE_DB_USERNAME}
    password: ${HIVE_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: hive
      maximum-pool-size: ${HIVE_DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  # Required from the environment: the real identity provider. Its JWKS is
  # fetched on first use and every bearer token is validated against it.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${HIVE_JWT_ISSUER_URI}

# AU-3 enforces HTTPS in prod (HttpsEnforcementConfig). TLS is terminated at the
# reverse proxy, so the client's original scheme arrives in `X-Forwarded-Proto`;
# without this, the channel rule would see the proxy's plain-HTTP hop and
# redirect forever.
server:
  forward-headers-strategy: framework
