spring:
  application:
    name: hive
  profiles:
    default: dev
  jpa:
    open-in-view: false

server:
  port: 8080

---
# Local development. Real datasource + security config are owned by later issues.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

---
# Test profile: embedded H2 in SQL Server compatibility mode, no Flyway.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:hive;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
