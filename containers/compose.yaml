# Hive -- full stack for Podman.
#
#   cd containers
#   cp .env.example .env          # then edit .env; it is gitignored
#   ./scripts/generate-certs.sh   # produces certs/ (also gitignored)
#   podman compose up -d
#   podman compose ps
#   podman compose down           # add -v to discard the database volume
#
# Build contexts are the REPOSITORY ROOT (..) because each Containerfile copies
# from backend/ or frontend/.
#
# This stack has been run: Podman 5 on Windows 11, 2026-09-15. Everything here
# is executed rather than merely reviewed -- images build, healthchecks pass, and
# a real authorization-code + PKCE login yields a token the backend accepts.
# docs/verification.md section 7 records what that first run cost.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hive-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - hive-db-data:/var/opt/mssql
    healthcheck:
      # sqlcmd moved under /opt/mssql-tools18 in the 2022 image, and -C is
      # required there because the server presents a self-signed certificate.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [hive]
    restart: unless-stopped

  idp:
    # The OAuth2 / OIDC identity provider. spec.md requires a standard,
    # OAuth-compatible login; the backend is a resource server that validates
    # the JWTs this issues, and the SPA obtains them by authorization code +
    # PKCE. The dev-profile token endpoint in the backend exists only for
    # environments where this container cannot be run.
    image: quay.io/keycloak/keycloak:26.0
    container_name: hive-idp
    command: ["start-dev", "--import-realm", "--https-port=8443"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/hive-idp.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/hive-idp.key
      KC_HEALTH_ENABLED: "true"
      # The browser reaches Keycloak only through the frontend gateway, at
      # https://localhost:8444/idp. One origin for the whole stack means the
      # issuer the SPA uses, the `iss` claim Keycloak mints and the URL the
      # login page redirects to are all the same string, derived at runtime
      # from window.location.origin rather than baked into the bundle.
      # The path matters: KC_HTTP_RELATIVE_PATH decides where Keycloak serves
      # itself, but the frontend URL it advertises comes from KC_HOSTNAME
      # alone. With the origin by itself it mints an issuer of
      # https://localhost:8444/realms/hive -- no /idp, so every URL in the
      # discovery document points at the SPA instead of at Keycloak.
      KC_HOSTNAME: ${OAUTH_PUBLIC_ORIGIN:?set OAUTH_PUBLIC_ORIGIN in .env}/idp
      # Keycloak serves itself under this prefix, so nginx proxies /idp/
      # straight through with no path rewriting to get wrong.
      KC_HTTP_RELATIVE_PATH: /idp
      # Trust the gateway's X-Forwarded-* headers; without this Keycloak builds
      # its redirect URLs from the internal hop and sends the browser to
      # https://idp:8443, which does not resolve outside the pod network.
      KC_PROXY_HEADERS: xforwarded
    # No published port. Keycloak is reached at https://localhost:8444/idp,
    # through the frontend gateway -- publishing 8543 as well would offer a
    # second origin that mints tokens the backend then rejects, which is the
    # exact failure this arrangement exists to prevent.
    volumes:
      - ./certs:/opt/keycloak/certs:ro,z
      - ./idp/realm-hive.json:/opt/keycloak/data/import/realm-hive.json:ro,z
    healthcheck:
      # NOT /health/ready on 9000: setting KC_HTTPS_* makes the management
      # interface inherit TLS ("Management interface listening on
      # https://0.0.0.0:9000" in the startup log), and this image ships no curl,
      # wget or openssl to speak it -- a plaintext probe there reads an empty
      # reply and fails forever. Realm discovery on the plaintext main port is
      # reachable with bash's /dev/tcp alone, and a 200 there proves the thing
      # the backend is actually waiting for: the realm imported.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /idp/realms/hive/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks: [hive]
    restart: unless-stopped

  db-init:
    # SQL Server creates no application database on its own, and the backend's
    # JDBC URL names one (databaseName=hive). Without this the first thing
    # Flyway does is fail with 'Cannot open database "hive" requested by the
    # login'. Idempotent, so it is a no-op on every run after the first.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hive-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S db,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('hive') IS NULL CREATE DATABASE hive"
    networks: [hive]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: containers/backend/Containerfile
    image: hive-backend:latest
    container_name: hive-backend
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8443
      # HTTPS at the application tier, not only at the edge (spec.md AU-3).
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /app/certs/hive-backend.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${CERT_PASSWORD:?set CERT_PASSWORD in .env}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      # These names are what application.yml actually reads. Using
      # SPRING_DATASOURCE_* here instead would be silently ignored, because the
      # prod profile binds the datasource from HIVE_DB_* placeholders.
      HIVE_DB_URL: jdbc:sqlserver://db:1433;databaseName=hive;encrypt=true;trustServerCertificate=true
      HIVE_DB_USERNAME: sa
      HIVE_DB_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      # application.yml's prod profile binds the issuer from HIVE_JWT_ISSUER_URI.
      # Setting the fully-expanded Spring property name here would also work by
      # relaxed binding, but only by silently outranking the placeholder -- using
      # the name the file actually reads keeps the wiring legible.
      #
      # These two are deliberately different URLs for the same server. The
      # issuer is the string in the token's `iss` claim, which is whatever the
      # browser used -- it is compared, never fetched. The JWKS URL is fetched,
      # so it has to be one this container can actually reach: the gateway
      # address resolves to the browser's loopback, not to anything visible
      # from in here. Pointing the issuer at an internal name instead would
      # reject every real token; pointing JWKS at the gateway would hang.
      HIVE_JWT_ISSUER_URI: ${OAUTH_PUBLIC_ORIGIN:?set OAUTH_PUBLIC_ORIGIN in .env}/idp/realms/hive
      HIVE_JWT_JWK_SET_URI: https://idp:8443/idp/realms/hive/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs:/app/certs:ro,z
    networks: [hive]
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: containers/frontend/Containerfile
    image: hive-frontend:latest
    container_name: hive-frontend
    depends_on:
      - backend
    environment:
      # Where the browser reaches this stack. The plaintext listener redirects
      # here; without it the redirect would drop the published port.
      HIVE_PUBLIC_ORIGIN: ${OAUTH_PUBLIC_ORIGIN:?set OAUTH_PUBLIC_ORIGIN in .env}
    ports:
      # 8080 is deliberately NOT published. The plaintext listener still runs
      # inside the container, for /healthz and for an orchestrator that wants a
      # certificate-free probe, but a browser that has loaded this app can
      # never reach it: the HSTS header from https://localhost:8444 is scoped
      # to the host and has no concept of a port, so http://localhost:8080 is
      # upgraded to TLS before it leaves the browser and dies against a
      # plaintext socket. Publishing it would only offer a door that looks open.
      - "127.0.0.1:8444:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro,z
    networks: [hive]
    restart: unless-stopped

volumes:
  hive-db-data:

networks:
  hive:
    driver: bridge
