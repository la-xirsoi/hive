# The SPA's security header set, kept in one file because nginx's add_header is
# replacing, not additive: a location that declares any add_header of its own
# discards every header inherited from the server block. So every location here
# that needs a header of its own includes this file to put the set back.
#
# Deliberately NOT included by /idp/, which serves Keycloak's pages and carries
# its own CSP and frame rules; it repeats only HSTS, a property of the origin.

# HSTS: two years, subdomains included. Note this is why the dev certificate
# must be trusted rather than click-through accepted -- once a browser sees
# this header for a host, it will refuse plaintext to that host entirely.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# connect-src is 'self' and nothing else: this server is the only origin the
# SPA talks to. The API lives under /api/ and the identity provider under
# /idp/, both proxied from the same server, so there is no second origin to
# allow -- and no deployed hostname to keep in sync here either.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
