# Hive frontend: HTTPS enforcement, SPA fallback, security headers.
#
# spec.md requires HTTPS to be enforced. Plaintext is not served -- it is
# redirected, permanently, before any application content is reachable.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The one thing answered over plaintext, so the container healthcheck and
    # any orchestrator probe do not need to trust the dev certificate.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Written at startup from HIVE_PUBLIC_ORIGIN (see public-origin.sh). Not
    # `https://$host`: $host is the Host header with the port stripped, so that
    # form sends the browser to port 443 and a connection refused.
    include /etc/nginx/hive-public-origin.conf;

    location / {
        return 301 $hive_public_origin$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/hive-frontend.crt;
    ssl_certificate_key /etc/nginx/certs/hive-frontend.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # add_header is replacing, not additive: any location that declares one of
    # its own starts from an empty set. So the set lives in a file, included
    # here for everything that declares nothing, and again in each location
    # that does. Adding an add_header anywhere below without this include
    # silently strips the lot from those responses.
    include /etc/nginx/hive-security-headers.conf;

    location = /healthz {
        access_log off;
        # default_type, not add_header: setting the type this way leaves the
        # inherited header set intact.
        default_type text/plain;
        return 200 'ok';
    }

    # --- Upstream proxies ---------------------------------------------------
    # `^~` matters: a plain prefix location loses to the regex asset location
    # below, so /idp/.../something.js would be answered from the SPA's document
    # root and 404 instead of reaching Keycloak. `^~` wins outright.
    #
    # Both upstreams speak TLS, and their certificates are verified against the
    # CA that issued them rather than skipped -- generate-certs.sh puts the
    # compose service name in each SAN, which is why proxy_ssl_name is that
    # name and not $host.

    location ^~ /api/ {
        # Through a variable, so nginx re-resolves the name instead of pinning
        # the address it saw at startup (see resolver.sh). A variable upstream
        # does not carry the request URI along with it, hence $request_uri.
        set $hive_backend https://backend:8443;
        proxy_pass $hive_backend$request_uri;

        proxy_ssl_trusted_certificate /etc/nginx/certs/hive-ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         backend;
        proxy_ssl_server_name  on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The backend runs `forward-headers-strategy: framework` and enforces
        # HTTPS in prod. TLS ends here, so without this it would see the
        # proxy's own hop and redirect forever.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8444;
    }

    location ^~ /idp/ {
        set $hive_idp https://idp:8443;
        proxy_pass $hive_idp$request_uri;

        proxy_ssl_trusted_certificate /etc/nginx/certs/hive-ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         idp;
        proxy_ssl_server_name  on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8444;

        # Keycloak's login and admin pages carry their own CSP and frame rules,
        # the SPA's set is wrong for them -- so this location deliberately does
        # NOT include hive-security-headers.conf, and declaring any add_header
        # here drops the inherited set, which is exactly what we want. HSTS is
        # repeated because it is a property of the origin, not of the page --
        # and Keycloak sends one of its own with a shorter max-age, which has to
        # be dropped first or the browser would honour that one instead (only
        # the first Strict-Transport-Security header of a response is read).
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Keycloak's state cookies and the authorization code in the callback
        # make for large headers; the 4k default buffer overflows on them.
        proxy_buffer_size   16k;
        proxy_buffers     8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Fingerprinted build assets are immutable; index.html must never be cached
    # or users keep running the previous deploy against the current API.
    #
    # max-age is spelled out rather than left to `expires 1y`, which would emit
    # its own Cache-Control alongside this one and send the header twice.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/hive-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The document the CSP above exists to protect, so the include is not
    # optional here: this location is also where the SPA fallback below lands.
    location = /index.html {
        include /etc/nginx/hive-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback: deep links and the OAuth redirect URI are client-side routes
    # and must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
