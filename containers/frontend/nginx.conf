# Hive frontend: HTTPS enforcement, SPA fallback, security headers.
#
# spec.md requires HTTPS to be enforced. Plaintext is not served -- it is
# redirected, permanently, before any application content is reachable.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The one thing answered over plaintext, so the container healthcheck and
    # any orchestrator probe do not need to trust the dev certificate.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Written at startup from HIVE_PUBLIC_ORIGIN (see public-origin.sh). Not
    # `https://$host`: $host is the Host header with the port stripped, so that
    # form sends the browser to port 443 and a connection refused.
    include /etc/nginx/hive-public-origin.conf;

    location / {
        return 301 $hive_public_origin$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/hive-frontend.crt;
    ssl_certificate_key /etc/nginx/certs/hive-frontend.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # HSTS: two years, subdomains included. Note this is why the dev certificate
    # must be trusted rather than click-through accepted -- once a browser sees
    # this header for a host, it will refuse plaintext to that host entirely.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # connect-src is 'self' and nothing else: this server is the only origin the
    # SPA talks to. The API lives under /api/ and the identity provider under
    # /idp/, both proxied below, so there is no second origin to allow -- and no
    # deployed hostname to keep in sync here either.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Upstream proxies ---------------------------------------------------
    # `^~` matters: a plain prefix location loses to the regex asset location
    # below, so /idp/.../something.js would be answered from the SPA's document
    # root and 404 instead of reaching Keycloak. `^~` wins outright.
    #
    # Both upstreams speak TLS, and their certificates are verified against the
    # CA that issued them rather than skipped -- generate-certs.sh puts the
    # compose service name in each SAN, which is why proxy_ssl_name is that
    # name and not $host.

    location ^~ /api/ {
        # Through a variable, so nginx re-resolves the name instead of pinning
        # the address it saw at startup (see resolver.sh). A variable upstream
        # does not carry the request URI along with it, hence $request_uri.
        set $hive_backend https://backend:8443;
        proxy_pass $hive_backend$request_uri;

        proxy_ssl_trusted_certificate /etc/nginx/certs/hive-ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         backend;
        proxy_ssl_server_name  on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The backend runs `forward-headers-strategy: framework` and enforces
        # HTTPS in prod. TLS ends here, so without this it would see the
        # proxy's own hop and redirect forever.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8444;
    }

    location ^~ /idp/ {
        set $hive_idp https://idp:8443;
        proxy_pass $hive_idp$request_uri;

        proxy_ssl_trusted_certificate /etc/nginx/certs/hive-ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         idp;
        proxy_ssl_server_name  on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8444;

        # Keycloak's login and admin pages carry their own CSP and frame rules,
        # and the SPA's headers above are wrong for them -- adding any header
        # here cancels the inherited set, which is exactly what we want. HSTS is
        # repeated because it is a property of the origin, not of the page.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Keycloak's state cookies and the authorization code in the callback
        # make for large headers; the 4k default buffer overflows on them.
        proxy_buffer_size   16k;
        proxy_buffers     8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Fingerprinted build assets are immutable; index.html must never be cached
    # or users keep running the previous deploy against the current API.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: deep links and the OAuth redirect URI are client-side routes
    # and must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
