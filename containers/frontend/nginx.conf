# Hive frontend: HTTPS enforcement, SPA fallback, security headers.
#
# spec.md requires HTTPS to be enforced. Plaintext is not served -- it is
# redirected, permanently, before any application content is reachable.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The one thing answered over plaintext, so the container healthcheck and
    # any orchestrator probe do not need to trust the dev certificate.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/hive-frontend.crt;
    ssl_certificate_key /etc/nginx/certs/hive-frontend.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # HSTS: two years, subdomains included. Note this is why the dev certificate
    # must be trusted rather than click-through accepted -- once a browser sees
    # this header for a host, it will refuse plaintext to that host entirely.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # connect-src must allow the API origin and the OAuth issuer, since the SPA
    # calls both directly. Adjust these to your deployed hostnames.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://hive-backend:8443 https://hive-idp:8443; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Fingerprinted build assets are immutable; index.html must never be cached
    # or users keep running the previous deploy against the current API.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: deep links and the OAuth redirect URI are client-side routes
    # and must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
